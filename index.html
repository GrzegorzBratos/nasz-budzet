<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Strona sama zabrania sobie łączenia się z czymkolwiek poza Google i samą sobą. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budżet">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Nasz budżet</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <main>
    <div>
      <h1>Nasz budżet</h1>
      <p class="sub">Wersja próbna: logowanie, połączenie z arkuszem i ikona na ekranie głównym</p>
    </div>

    <section class="karta" id="logowanie">
      <p class="sub">Zaloguj się kontem Google. Dostęp mają tylko nasze dwa konta.</p>
      <div id="przycisk"></div>
    </section>

    <section class="karta" id="zalogowany" hidden>
      <div class="wiersz"><span>Zalogowany</span><span id="kto"></span></div>
      <div class="wiersz"><span>Dane z banku z</span><span id="godzina"></span></div>
      <div class="wiersz"><span>Tryb</span><span id="tryb"></span></div>
      <button id="wyloguj" type="button">Wyloguj</button>
    </section>

    <p id="stan" role="status"></p>
  </main>
</body>
</html>
